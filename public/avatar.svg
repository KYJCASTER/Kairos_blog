<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kairos emblem avatar</title>
  <desc id="desc">A refined Kairos emblem: an open time ring, a copper threshold mark, and a serif wordmark on warm parchment.</desc>

  <defs>
    <radialGradient id="vellum" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#FFF9EE" />
      <stop offset="56%" stop-color="#EDE2CF" />
      <stop offset="100%" stop-color="#C7AF88" />
    </radialGradient>

    <linearGradient id="copper" x1="18%" y1="12%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#D8A864" />
      <stop offset="38%" stop-color="#B65B2A" />
      <stop offset="100%" stop-color="#6F2D17" />
    </linearGradient>

    <radialGradient id="momentGlow" cx="72%" cy="27%" r="48%">
      <stop offset="0%" stop-color="#D8A864" stop-opacity="0.26" />
      <stop offset="42%" stop-color="#C2410C" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0" />
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="29" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.33 0 0 0 0 0.20 0 0 0 0.095 0" />
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>

    <filter id="medallionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A1B12" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.36" />
    </filter>

    <filter id="letterpress" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.7" flood-color="#FFFFFF" flood-opacity="0.58" />
      <feDropShadow dx="0" dy="-1" stdDeviation="0.9" flood-color="#2A1B12" flood-opacity="0.16" />
    </filter>

    <clipPath id="sealClip">
      <circle cx="200" cy="200" r="174" />
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="none" />

  <!-- parchment medallion -->
  <circle cx="200" cy="200" r="184" fill="#F7EFE3" filter="url(#medallionShadow)" />
  <circle cx="200" cy="200" r="174" fill="url(#vellum)" filter="url(#grain)" />

  <g clip-path="url(#sealClip)">
    <rect width="400" height="400" fill="url(#momentGlow)" />
    <path d="M43 255 C101 231 149 247 201 224 C258 199 312 209 363 176" fill="none" stroke="#7C2D12" stroke-width="1" opacity="0.075" stroke-linecap="round" />
    <path d="M55 309 C115 281 176 305 235 276 C285 252 330 259 370 232" fill="none" stroke="#7C2D12" stroke-width="0.9" opacity="0.065" stroke-linecap="round" />
  </g>

  <!-- outer quiet rules: editorial seal, not a clock face -->
  <circle cx="200" cy="200" r="174" fill="none" stroke="#7C2D12" stroke-width="1.2" opacity="0.28" />
  <circle cx="200" cy="200" r="151" fill="none" stroke="#7C2D12" stroke-width="0.75" opacity="0.12" stroke-dasharray="1 11" stroke-linecap="round" />

  <!-- Kairos concept: an open time ring. The gap is the opportunity window. -->
  <g fill="none" stroke-linecap="round">
    <path d="M91 211 A111 111 0 1 1 292 135" stroke="#7C2D12" stroke-width="1.1" opacity="0.18" />
    <path d="M103 211 A99 99 0 1 1 284 142" stroke="url(#copper)" stroke-width="3.4" opacity="0.86" />
    <path d="M123 211 A79 79 0 1 1 269 154" stroke="url(#copper)" stroke-width="0.9" opacity="0.28" />
  </g>

  <!-- threshold mark: the exact moment where action becomes possible -->
  <g transform="translate(286 139) rotate(42)">
    <path d="M-18 0 H18" stroke="#6F2D17" stroke-width="2" stroke-linecap="round" opacity="0.56" />
    <path d="M0 -18 V18" stroke="#6F2D17" stroke-width="2" stroke-linecap="round" opacity="0.56" />
    <circle cx="0" cy="0" r="7" fill="url(#copper)" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#B65B2A" stroke-width="0.8" opacity="0.28" />
  </g>

  <!-- central identity: K as personal mark -->
  <text x="197" y="227" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-style="italic" font-weight="600" letter-spacing="-8" fill="#1F1B16" opacity="0.93" filter="url(#letterpress)">K</text>
  <text x="202" y="231" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-style="italic" font-weight="600" letter-spacing="-8" fill="url(#copper)" opacity="0.13">K</text>

  <!-- full name is the real brand, not just an initial -->
  <g transform="translate(200 273)">
    <path d="M-82 0 C-40 15 40 15 82 0" fill="none" stroke="url(#copper)" stroke-width="1.35" opacity="0.58" stroke-linecap="round" />
    <text x="0" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" letter-spacing="5.4" fill="#342217">KAIROS</text>
    <text x="0" y="53" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="8.2" letter-spacing="2.4" fill="#8A4B22" opacity="0.66">THE RIGHT MOMENT</text>
  </g>

  <!-- subtle registration marks imply precision without becoming mechanical -->
  <g fill="#7C2D12" opacity="0.26">
    <circle cx="91" cy="211" r="2.2" />
    <path d="M200 75 L202.2 83 L210 85 L202.2 87 L200 95 L197.8 87 L190 85 L197.8 83 Z" />
  </g>
  <g fill="none" stroke="#7C2D12" stroke-width="0.75" opacity="0.20" stroke-linecap="round">
    <path d="M84 200 H116" />
    <path d="M270 200 H302" />
  </g>
</svg>
